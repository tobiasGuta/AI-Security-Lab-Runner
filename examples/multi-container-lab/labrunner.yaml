version: 1
name: "multi-container-lab"
description: "Multi-container example lab with web frontend and db target"

workspace: "."

targets:
  - name: "web"
    build:
      context: "services/web"
      dockerfile: "Dockerfile"
    internal_port: 8080
    healthcheck:
      url: "http://web:8080/health"
      timeout_seconds: 30
      interval_seconds: 1
  - name: "db"
    build:
      context: "services/db"
      dockerfile: "Dockerfile"
    internal_port: 5432

host_access:
  publish: false
  bind_address: "127.0.0.1"

limits:
  target_memory: "512m"
  runner_memory: "1g"

runner:
  workspace_mount: "."
  scratch_persistent: false
