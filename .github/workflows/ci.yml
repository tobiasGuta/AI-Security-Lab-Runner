name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Code Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      # Several unit/integration packages exercise real runner containers and
      # validate the image version. Build the local image before those tests so
      # a fresh GitHub-hosted runner has the dependency they require.
      - name: Build Runner Container Image
        run: docker build -t ai-security-agent-runner:latest -f runner/Dockerfile runner/

      - name: Go Unit Tests
        run: go test -v ./...

      - name: Go Race Detector Tests
        run: go test -v -race ./...

      - name: Build Executable Binary
        run: go build -o lab-runner ./cmd/lab-runner

      - name: Infrastructure Health Check (Doctor)
        run: ./lab-runner doctor
