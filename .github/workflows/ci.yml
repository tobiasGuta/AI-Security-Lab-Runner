name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Code Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      # Several packages exercise real runner containers and validate the image
      # version, so a fresh CI worker must build it before tests begin.
      - name: Build Runner Container Image
        run: docker build -t ai-security-agent-runner:latest -f runner/Dockerfile runner/

      - name: Go Tests - Core
        run: |
          go test -v \
            ./internal/audit \
            ./internal/config \
            ./internal/docker \
            ./internal/output \
            ./internal/pathsafe \
            ./internal/scratchfs \
            ./internal/security \
            ./internal/session \
            ./internal/transcript \
            ./internal/validation

      - name: Go Tests - Lab
        run: go test -v ./internal/lab

      - name: Go Tests - MCP
        run: go test -v ./internal/mcp

      - name: Go Race Detector Tests
        run: go test -v -race ./...

      - name: Build Executable Binary
        run: go build -o lab-runner ./cmd/lab-runner

      - name: Infrastructure Health Check (Doctor)
        run: ./lab-runner doctor
